name: Fix responsive image aspect ratios

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve screenshot aspect ratios
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text()

          replacements = {
              "img { max-width: 100%; display: block; }":
                  "img { max-width: 100%; height: auto; display: block; object-fit: contain; }",
              ".watch-float img { width: 100%; border-radius: 22px; }":
                  ".watch-float img { width: 100%; height: auto; object-fit: contain; border-radius: 22px; }",
              "    .iphone-shot {\n      width: min(355px, 100%);":
                  "    .iphone-shot {\n      width: min(355px, 100%);\n      height: auto;\n      object-fit: contain;",
              "    .watch-shot {\n      width: min(360px,100%);":
                  "    .watch-shot {\n      width: min(360px,100%);\n      height: auto;\n      object-fit: contain;",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected CSS not found: {old!r}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix screenshot aspect ratios on mobile"
          git push
